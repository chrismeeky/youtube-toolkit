<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>YouTube Toolkit</title>
</head>
<body>
  <header class="head">
    <h1>YouTube Toolkit</h1>
    <p class="sub">Settings now live on YouTube itself — open the <b>Toolkit</b> button in the
      top bar, beside Create.</p>
  </header>

  <!-- What is left here is what a popup is actually good for: things that act on the tab you
       are looking at, and the one panel worth seeing when you are not on YouTube at all. -->
  <section class="group">
    <h2>Pocket watch <button type="button" id="watchRun" class="mini">Check now</button></h2>
    <p class="hint" id="watchMeta">Watching your pocketed channels for uploads beating their
      own average.</p>
    <div id="watchList"></div>
  </section>

  <section class="group">
    <h2>This page</h2>
    <div class="actions">
      <button type="button" id="selectMode" class="btn">Select videos…</button>
      <button type="button" id="copyPage" class="btn btn--primary">Copy all on page</button>
    </div>
    <p class="hint keys">Alt+Shift+S select mode · Alt+Shift+C copy selection</p>
    <p class="hint"><button type="button" id="clearSubs" class="linkbtn">Clear cached channel
      data</button></p>
  </section>

  <p class="status" id="status"></p>

  <script src="format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
